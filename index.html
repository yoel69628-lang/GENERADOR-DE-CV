<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IngeniaCV Pro - Diseñador de Currículums para Ingeniería</title>
    <!-- Librerías Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* CSS Base[cite: 1] */
        :root { --primary: #1e3a8a; --accent: #0284c7; --bg-main: #f8fafc; --sidebar-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border: #cbd5e1; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; }
        
        /* Layout y Componentes (Tu CSS previo)[cite: 1] */
        #landing-page { position: fixed; top:0; left:0; width:100%; height:100%; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; display: flex; flex-direction: column; align-items: center; z-index: 1000; padding: 50px 20px; transition: all 0.5s ease; }
        #landing-page.hidden { opacity: 0; pointer-events: none; }
        #app-interface { display: none; flex-direction: column; height: 100vh; }
        #app-interface.active { display: flex; }
        .main-wrapper { display: flex; flex: 1; height: calc(100vh - 120px); }
        .editor-container { width: 45%; overflow-y: auto; padding: 30px; }
        .preview-container { width: 55%; background: var(--bg-main); overflow-y: auto; padding: 40px 20px; display: flex; justify-content: center; }
        .cv-sheet { width: 210mm; min-height: 297mm; background: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.08); display: flex; }
        .paywall { position: absolute; top: 0; right: -100%; width: 40%; height: 100%; background: white; z-index: 100; transition: right 0.3s ease; padding: 30px; }
        .paywall.active { right: 0; }
    </style>
</head>
<body>

    <!-- Landing Page[cite: 1] -->
    <div id="landing-page">
        <h1>IngeniaCV Pro</h1>
        <button class="btn-start" onclick="enterApp()">Comenzar</button>
    </div>

    <!-- App Interface[cite: 1] -->
    <div id="app-interface">
        <div class="main-wrapper">
            <div class="editor-container" id="editor-area">
                <!-- Aquí van tus fases[cite: 1] -->
                <div class="phase-block active" id="ph-1">
                    <input type="text" id="in-name" placeholder="Nombre" oninput="liveRender()">
                    <!-- ... resto de tus campos ... -->
                </div>
                <div class="nav-controls">
                    <button id="next-btn" onclick="moveStep(1)">Siguiente</button>
                    <button id="finish-btn" style="display:none;" onclick="openPaywall()">Descargar</button>
                </div>
            </div>
            <div class="preview-container">
                <div class="cv-sheet" id="cv-target"></div>
            </div>
        </div>

        <!-- Muro de Pago con Descarga Integrada -->
        <div class="paywall" id="paywall-screen">
            <h2>Exportación Profesional</h2>
            <button onclick="descargarPDF()">Descargar mi CV PDF</button>
        </div>
    </div>

    <script>
        let step = 1;
        let currentLayout = 'aura';

        function enterApp() {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('app-interface').classList.add('active');
            liveRender();
        }

        // Función de Descarga PDF con html2pdf.js[cite: 1]
        function descargarPDF() {
            const element = document.getElementById('cv-target');
            const opt = {
                margin: 0,
                filename: 'Mi_CV_Ingenieria.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // Lógica de Renderizado y Navegación (Tu lógica existente)[cite: 1]
        function liveRender() { /* Tu función original[cite: 1] */ }
        function moveStep(dir) { /* Tu función original[cite: 1] */ }
        function openPaywall() { document.getElementById('paywall-screen').classList.toggle('active'); }
        
        window.onload = () => { liveRender(); };
    </script>
</body>
</html>
