<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IngeniaCV Pro | Plataforma Técnica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        /* ESTILOS CONSOLIDADOS */
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f8fafc; }
        .hero { background: #0f172a; color: white; padding: 80px 20px; text-align: center; }
        .btn-main { background: #0284c7; color: white; padding: 15px 40px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 18px; }
        
        #app-interface { display: none; height: 100vh; flex-direction: column; }
        .editor-layout { display: flex; height: 100%; }
        .form-panel { width: 40%; padding: 30px; overflow-y: auto; background: white; border-right: 1px solid #ddd; }
        .preview-panel { width: 60%; padding: 40px; background: #e2e8f0; overflow-y: auto; }
        
        .cv-paper { background: white; width: 210mm; min-height: 297mm; padding: 20mm; margin: 0 auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .input-field { margin-bottom: 15px; }
        .input-field label { display: block; font-size: 12px; font-weight: bold; }
        .input-field input, .input-field textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="landing-page" class="hero">
        <h1>IngeniaCV Pro</h1>
        <p>Herramienta especializada para Gerencia de Obras y Contratos.</p>
        <button class="btn-main" onclick="startApp()">Crear CV Técnico</button>
    </div>

    <div id="app-interface">
        <div class="editor-layout">
            <div class="form-panel">
                <h2>Parámetros Técnicos</h2>
                <div class="input-field"><label>Nombre</label><input type="text" id="name" oninput="updateCV()"></div>
                <div class="input-field"><label>Presupuesto Gestionado (USD)</label><input type="text" id="presupuesto" oninput="updateCV()"></div>
                <div class="input-field"><label>Software (AutoCAD, P6, SAP2000)</label><input type="text" id="software" oninput="updateCV()"></div>
                <div class="input-field"><label>Logros en Liquidación de Obras</label><textarea id="logros" oninput="updateCV()"></textarea></div>
                <button class="btn-main" style="width:100%;" onclick="window.print()">Descargar PDF</button>
            </div>
            <div class="preview-panel">
                <div class="cv-paper" id="cv-content">
                    <h1 id="cv-name">Nombre</h1>
                    <hr>
                    <p><strong>Presupuesto gestionado:</strong> <span id="cv-presupuesto">-</span></p>
                    <p><strong>Stack Técnico:</strong> <span id="cv-software">-</span></p>
                    <p><strong>Logros clave:</strong> <span id="cv-logros">-</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function startApp() {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('app-interface').style.display = 'flex';
        }
        function updateCV() {
            document.getElementById('cv-name').innerText = document.getElementById('name').value || "Nombre";
            document.getElementById('cv-presupuesto').innerText = document.getElementById('presupuesto').value || "-";
            document.getElementById('cv-software').innerText = document.getElementById('software').value || "-";
            document.getElementById('cv-logros').innerText = document.getElementById('logros').value || "-";
        }
    </script>
</body>
</html>
