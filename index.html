<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IngeniaCV Pro - Diseñador de Currículums para Ingeniería</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #1e3a8a; /* Azul Marino por defecto */
            --accent: #0284c7;
            --bg-main: #f8fafc;
            --sidebar-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* PORTAL DE INICIO */
        #landing-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; display: flex; flex-direction: column; align-items: center; z-index: 1000; overflow-y: auto; padding: 50px 20px; transition: all 0.5s ease; }
        #landing-page.hidden { opacity: 0; pointer-events: none; transform: translateY(-50px); }
        
        .landing-header { text-align: center; max-width: 800px; margin-bottom: 40px; }
        .landing-logo { font-size: 46px; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .landing-logo span { color: #38bdf8; }
        .landing-tagline { font-size: 18px; color: #94a3b8; line-height: 1.6; }

        .showcase-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; max-width: 1100px; width: 100%; margin-bottom: 40px; }
        .showcase-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 20px; text-align: center; }
        .showcase-icon { font-size: 32px; color: #38bdf8; margin-bottom: 12px; }
        .btn-start { background: #0284c7; color: white; padding: 16px 40px; font-size: 18px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4); }

        /* APP EDITOR */
        #app-interface { display: none; flex-direction: column; height: 100vh; }
        #app-interface.active { display: flex; }
        .navbar { background: #fff; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); height: 65px; z-index: 10; }
        .logo { font-size: 22px; font-weight: 800; color: #1e3a8a; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--accent); }

        .wizard-steps { display: flex; background: #fff; padding: 12px; border-bottom: 1px solid var(--border); justify-content: center; gap: 15px; font-size: 13px; font-weight: 700; }
        .step { display: flex; align-items: center; gap: 8px; color: var(--text-muted); padding: 4px 8px; }
        .step.active { color: var(--accent); background: #f0f9ff; border-radius: 6px; }

        .main-wrapper { display: flex; flex: 1; height: calc(100vh - 120px); position: relative; }
        .editor-container { width: 45%; background: var(--sidebar-bg); border-right: 1px solid var(--border); overflow-y: auto; padding: 30px; }
        .preview-container { width: 55%; background: var(--bg-main); overflow-y: auto; padding: 40px 20px; display: flex; justify-content: center; }
        
        .cv-sheet { width: 210mm; min-height: 297mm; background: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.08); display: flex; box-sizing: border-box; }
        
        /* Modelos de diseño */
        .model-aura, .model-minimal, .model-engineering { width: 100%; }
        
        /* Muro de Pago */
        .paywall { position: absolute; top: 0; right: -100%; width: 40%; height: 100%; background: white; box-shadow: -6px 0 20px rgba(0,0,0,0.1); z-index: 100; transition: right 0.3s ease; padding: 30px; display: flex; flex-direction: column; }
        .paywall.active { right: 0; }
        .paywall-box { background: #fef3c7; border: 1px solid #fde68a; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        
        .btn { padding: 10px 22px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div id="landing-page">
        <div class="landing-header">
            <div class="landing-logo"><i class="fa-solid fa-graduation-cap"></i> Ingenia<span>CV</span> Pro</div>
            <div class="landing-tagline">El constructor de CVs para ingenieros.</div>
        </div>
        <button class="btn-start" onclick="enterApp()"><i class="fa-solid fa-file-signature"></i> Comenzar</button>
    </div>

    <div id="app-interface">
        <nav class="navbar">
            <div class="logo">Ingenia<span>CV</span> Pro</div>
        </nav>
        
        <div class="main-wrapper">
            <div class="editor-container" id="editor-wrapper">
                <button class="btn btn-finish" id="finish-btn" onclick="openPaywall()">Descargar Documento</button>
            </div>
            <div class="preview-container">
                <div class="cv-sheet" id="cv-target"></div>
            </div>
        </div>

        <div class="paywall" id="paywall-screen">
            <h2>Exportación Profesional</h2>
            <div class="paywall-box">
                <p>Descarga tu CV en PDF de alta calidad</p>
            </div>
            <button class="btn" style="background:var(--primary); color:white; width:100%; justify-content:center;" onclick="descargarPDF()">
                <i class="fa-solid fa-cloud-arrow-down"></i> Descargar mi CV PDF
            </button>
        </div>
    </div>

    <script>
        let step = 1;
        const maxSteps = 5;
        let currentLayout = 'aura';

        function descargarPDF() {
            const element = document.getElementById('cv-target');
            const opt = {
                margin: 0,
                filename: 'Mi_CV_Ingenieria.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        function enterApp() {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('app-interface').classList.add('active');
            liveRender();
        }

        // Mantén aquí todas tus funciones originales (liveRender, changeColor, moveStep, etc.)
        // ... (Tu código original continúa aquí)
        
        window.onload = () => { liveRender(); };
    </script>
</body>
</html>
