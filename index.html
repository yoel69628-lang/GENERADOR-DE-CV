<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de CV</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f5f5f5}
.container{display:flex;gap:20px;flex-wrap:wrap}
.panel,.preview{background:white;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.panel{flex:1;min-width:300px}
.preview{flex:1;min-width:300px}
input,textarea{width:100%;padding:10px;margin:5px 0 15px}
button{padding:10px 15px;cursor:pointer}
h1,h2,h3{margin:5px 0}
</style>
</head>
<body>
<h1>Generador de CV</h1>
<div class="container">
<div class="panel">
<input id="nombre" placeholder="Nombre completo">
<input id="cargo" placeholder="Profesión">
<input id="email" placeholder="Email">
<textarea id="resumen" placeholder="Resumen profesional"></textarea>
<button onclick="actualizar()">Actualizar CV</button>
<button onclick="window.print()">Descargar PDF</button>
</div>

<div class="preview">
<h1 id="vNombre">Tu Nombre</h1>
<h3 id="vCargo">Profesión</h3>
<p id="vEmail">email@ejemplo.com</p>
<hr>
<h2>Resumen</h2>
<p id="vResumen">Describe tu perfil profesional.</p>
</div>
</div>

<script>
function actualizar(){
document.getElementById('vNombre').innerText=document.getElementById('nombre').value||'Tu Nombre';
document.getElementById('vCargo').innerText=document.getElementById('cargo').value||'Profesión';
document.getElementById('vEmail').innerText=document.getElementById('email').value||'email@ejemplo.com';
document.getElementById('vResumen').innerText=document.getElementById('resumen').value||'Describe tu perfil profesional.';
}
</script>
</body>
</html>
