<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IngeniaCV Pro - Diseñador de Currículums para Ingeniería</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <!-- Librería de descarga PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* [TUS ESTILOS ORIGINALES] */
        :root { --primary: #1e3a8a; --accent: #0284c7; --bg-main: #f8fafc; --sidebar-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border: #cbd5e1; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #landing-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; display: flex; flex-direction: column; align-items: center; z-index: 1000; overflow-y: auto; padding: 50px 20px; transition: all 0.5s ease; }
        #landing-page.hidden { opacity: 0; pointer-events: none; transform: translateY(-50px); }
        .showcase-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; max-width: 1100px; width: 100%; margin-bottom: 40px; }
        .btn-start { background: #0284c7; color: white; padding: 16px 40px; font-size: 18px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4); }
        #app-interface { display: none; flex-direction: column; height: 100vh; }
        #app-interface.active { display: flex; }
        .navbar { background: #fff; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); height: 65px; }
        .main-wrapper { display: flex; flex: 1; height: calc(100vh - 120px); position: relative; }
        .editor-container { width: 45%; background: var(--sidebar-bg); border-right: 1px solid var(--border); overflow-y: auto; padding: 30px; }
        .preview-container { width: 55%; background: var(--bg-main); overflow-y: auto; padding: 40px 20px; display: flex; justify-content: center; }
        .cv-sheet { width: 210mm; min-height: 297mm; background: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.08); display: flex; box-sizing: border-box; }
        .paywall { position: absolute; top: 0; right: -100%; width: 40%; height: 100%; background: white; box-shadow: -6px 0 20px rgba(0,0,0,0.1); z-index: 100; transition: right 0.3s ease; padding: 30px; }
        .paywall.active { right: 0; }
        /* (Agrega aquí el resto de tus estilos de modelos de CV que tenías originalmente) */
    </style>
</head>
<body>

    <!-- PORTAL DE INICIO -->
    <div id="landing-page">
        <!-- [TU CÓDIGO DE LANDING ORIGINAL] -->
        <button class="btn-start" onclick="enterApp()"><i class="fa-solid fa-file-signature"></i> Comenzar a Construir mi CV</button>
    </div>

    <!-- APP INTERFACE -->
    <div id="app-interface">
        <!-- [TU CÓDIGO DE NAVBAR Y PASOS ORIGINALES] -->
        <div class="main-wrapper">
            <div class="editor-container" id="editor-wrapper">
                <!-- [TUS FASES Y INPUTS ORIGINALES] -->
                <div class="nav-controls">
                    <button class="btn btn-back" id="back-btn" onclick="moveStep(-1)">Atrás</button>
                    <button class="btn btn-next" id="next-btn" onclick="moveStep(1)">Siguiente</button>
                    <button class="btn btn-finish" id="finish-btn" onclick="openPaywall()">Descargar</button>
                </div>
            </div>
            <div class="preview-container">
                <div class="cv-sheet" id="cv-target"></div>
            </div>
        </div>

        <!-- Muro de Pago -->
        <div class="paywall" id="paywall-screen">
            <h2><i class="fa-solid fa-lock"></i> Exportación Profesional</h2>
            <button class="btn" onclick="descargarPDF()" style="width:100%; background:var(--primary); color:white;">Descargar Documento PDF</button>
        </div>
    </div>

    <script>
        // --- TU LÓGICA ORIGINAL ---
        let step = 1;
        let currentLayout = 'aura';

        function enterApp() {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('app-interface').classList.add('active');
            liveRender();
        }

        // --- NUEVA LÓGICA DE DESCARGA ---
        function descargarPDF() {
            const element = document.getElementById('cv-target');
            const opt = {
                margin: 0,
                filename: 'Mi_CV_Ingenieria.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // --- TU LÓGICA ORIGINAL DE liveRender, moveStep, addExperienceField, etc. ---
        // [PEGA AQUÍ TODAS TUS FUNCIONES ORIGINALES DEL SCRIPT]
    </script>
</body>
</html>
