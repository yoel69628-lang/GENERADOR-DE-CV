<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Constructor CV Pro - Wizard</title>
    <!-- Librería para generar el PDF desde el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; background: #f8fafc; }
        #wizard { width: 40%; padding: 30px; background: white; border-right: 1px solid #e2e8f0; overflow-y: auto; }
        #preview { width: 60%; padding: 40px; display: flex; justify-content: center; overflow-y: auto; }
        .step { display: none; }
        .step.active { display: block; }
        .cv-sheet { width: 210mm; min-height: 297mm; background: white; padding: 20mm; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        
        /* Muro de Pago Oculto */
        #paywall { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; justify-content: center; align-items: center; z-index: 1000; }
        .paywall-content { background: #1e3a8a; padding: 40px; border-radius: 10px; text-align: center; }
        
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; }
        .btn-next { background: #0284c7; color: white; }
    </style>
</head>
<body>

<div id="wizard">
    <div id="step-1" class="step active">
        <h2>Datos Personales</h2>
        <input type="text" id="name" placeholder="Nombre Completo" oninput="render()">
    </div>
    
    <div id="step-2" class="step">
        <h2>Experiencia</h2>
        <div id="exp-container"></div>
        <button onclick="addExp()">+ Agregar Puesto</button>
    </div>

    <div style="margin-top: 30px;">
        <button onclick="changeStep(-1)">Atrás</button>
        <button class="btn-next" onclick="changeStep(1)">Siguiente</button>
        <button onclick="showPaywall()">Descargar CV</button>
    </div>
</div>

<div id="preview">
    <div id="cv-render" class="cv-sheet">
        <h1 id="r-name"></h1>
        <div id="r-exp"></div>
    </div>
</div>

<!-- Muro de Pago -->
<div id="paywall">
    <div class="paywall-content">
        <h2>Desbloquea tu descarga</h2>
        <p>Suscríbete para obtener tu archivo PDF profesional.</p>
        <button onclick="downloadPDF()">Descargar Ahora</button>
        <button onclick="hidePaywall()">Cerrar</button>
    </div>
</div>

<script>
    let currentStep = 1;

    function changeStep(dir) {
        document.getElementById(`step-${currentStep}`).classList.remove('active');
        currentStep = Math.max(1, Math.min(2, currentStep + dir));
        document.getElementById(`step-${currentStep}`).classList.add('active');
    }

    function addExp() {
        const input = document.createElement('input');
        input.placeholder = "Puesto de trabajo";
        input.oninput = render;
        input.className = "exp-input";
        document.getElementById('exp-container').appendChild(input);
    }

    function render() {
        document.getElementById('r-name').innerText = document.getElementById('name').value;
        const exps = document.querySelectorAll('.exp-input');
        document.getElementById('r-exp').innerHTML = Array.from(exps).map(e => `<p>• ${e.value}</p>`).join('');
    }

    function showPaywall() { document.getElementById('paywall').style.display = 'flex'; }
    function hidePaywall() { document.getElementById('paywall').style.display = 'none'; }

    function downloadPDF() {
        html2pdf().from(document.getElementById('cv-render')).save('Mi_CV_Profesional.pdf');
        hidePaywall();
    }
</script>
</body>
</html>
